<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23725bd2'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='68' font-family='Arial,sans-serif' font-weight='700' fill='white'%3ET%3C/text%3E%3C/svg%3E" />
    <title>Tic Tac Toe — Let’s Play &amp; Have Fun!</title>
    <meta name="description" content="A bright and cheerful game of Tic Tac Toe. Pick a side, take turns, and see who gets three in a row!" />
    <link rel="stylesheet" href="tic-tac-toi.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div class="title-art" aria-hidden="true">
          <span class="sparkle sparkle-left">✦</span>
          <span class="title-symbol title-symbol-x">×</span>
          <span class="title-symbol title-symbol-o">○</span>
          <span class="sparkle sparkle-right">✦</span>
        </div>
        <p class="eyebrow">A little friendly competition</p>
        <h1>TIC TAC TOE</h1>
        <p class="subtitle">Let’s Play &amp; Have Fun!</p>
      </header>

      <section class="game-card" aria-label="Tic Tac Toe game">
        <div class="mode-switch" role="group" aria-label="Choose a game mode">
          <button class="mode-button is-active" id="mode-two-player" type="button" aria-pressed="true">
            <span aria-hidden="true">👥</span>
            <span>2 Players</span>
          </button>
          <button class="mode-button" id="mode-single-player" type="button" aria-label="Single player, play against the computer" aria-pressed="false">
            <span aria-hidden="true">🤖</span>
            <span>Play Computer</span>
          </button>
        </div>

        <div class="player-row" aria-label="Players and scores">
          <article class="player-card player-x is-active" id="player-x-card" aria-label="Player 1, X wins">
            <span class="player-mark" aria-hidden="true">X</span>
            <div class="player-details">
              <span class="player-name">Player 1</span>
              <span class="player-symbol-label">Player X wins</span>
            </div>
            <span class="player-score" id="score-x" aria-label="Player X score">0</span>
          </article>

          <div class="versus" aria-hidden="true">VS</div>

          <article class="player-card player-o" id="player-o-card" aria-label="Player 2, O wins">
            <span class="player-mark" aria-hidden="true">O</span>
            <div class="player-details">
              <span class="player-name">Player 2</span>
              <span class="player-symbol-label">Player O wins</span>
            </div>
            <span class="player-score" id="score-o" aria-label="Player O score">0</span>
          </article>
        </div>

        <div class="game-prompt">
          <span class="prompt-sparkle" aria-hidden="true">✦</span>
          <p id="status-message" role="status" aria-live="polite" aria-atomic="true">X goes first — pick a spot!</p>
          <span class="prompt-sparkle" aria-hidden="true">✦</span>
        </div>

        <div class="board-wrap">
          <div class="board-doodle board-doodle-top" aria-hidden="true">✦</div>
          <div class="board-doodle board-doodle-bottom" aria-hidden="true">●</div>
          <div class="game-board" id="game-board" role="group" aria-label="Tic Tac Toe board">
            <button class="board-cell" type="button" data-cell aria-label="Cell 1, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 2, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 3, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 4, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 5, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 6, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 7, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 8, empty"></button>
            <button class="board-cell" type="button" data-cell aria-label="Cell 9, empty"></button>
          </div>
        </div>

        <div class="round-footer">
          <div class="draw-score" aria-label="Draws">
            <span class="draw-icon" aria-hidden="true">🤝</span>
            <span class="draw-label">Draws</span>
            <span class="draw-value" id="score-draws">0</span>
          </div>
          <div class="game-actions">
            <button class="button button-secondary" id="new-game" type="button">
              <span aria-hidden="true">↻</span> New game
            </button>
            <button class="button button-quiet" id="reset-score" type="button">
              Reset score
            </button>
          </div>
        </div>

        <section class="result-panel" id="result-panel" aria-live="polite" aria-atomic="true" hidden>
          <span class="result-confetti" aria-hidden="true">🎉</span>
          <div class="result-copy">
            <h2 id="result-message">You did it!</h2>
            <p>That was a great round!</p>
          </div>
          <button class="button button-replay" id="replay-button" type="button">
            Play again <span aria-hidden="true">→</span>
          </button>
        </section>
      </section>

      <footer class="page-footer">
        <span aria-hidden="true">★</span> Take turns, cheer each other on <span aria-hidden="true">★</span>
      </footer>
    </main>
    
    <script type="module" src="tic-tac-toi.js"></script>
  </body>
</html>
