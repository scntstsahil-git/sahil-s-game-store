
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - Memory Game</title>
    <link rel="stylesheet" href="memory_challenge.css">
</head>
<body>

    <main class="game-container">

        <header class="game-header">
            <div class="logo">🧠</div>
            <h1>Simon Says</h1>
            <p>Remember the colors. Repeat the pattern!</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>⭐ Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat-card">
                <span>🎯 Level</span>
                <strong id="level">0</strong>
            </div>

            <div class="stat-card">
                <span>🏆 Best</span>
                <strong id="best">0</strong>
            </div>
        </section>

        <div id="status" class="status">
            Ready to test your memory?
        </div>

        <section id="game-board" class="game-board">

            <button class="color-btn green" data-color="0"
                aria-label="Green button"></button>

            <button class="color-btn red" data-color="1"
                aria-label="Red button"></button>

            <button class="color-btn yellow" data-color="2"
                aria-label="Yellow button"></button>

            <button class="color-btn blue" data-color="3"
                aria-label="Blue button"></button>

        </section>

        <button id="start-btn" class="start-btn">
            ▶ Start Game
        </button>

        <button id="sound-btn" class="sound-btn">
            🔊 Sound: ON
        </button>

        <p class="instructions">
            💡 Watch the sequence carefully, then repeat it!
        </p>

    </main>

    <script src="memory_challenge.js"></script>
</body>
</html>
